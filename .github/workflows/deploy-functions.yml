# Deploys the Edge Functions to every configured Supabase project (.env.development, .env.production).
# One-time setup on GitHub: Settings → Secrets and variables → Actions → secret SUPABASE_ACCESS_TOKEN
# (a personal access token from supabase.com/dashboard/account/tokens).
name: Deploy functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - "src/core/**"
      - "src/puzzles/**"
      - "src/server/**"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env-file: [.env.development, .env.production]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test # the function runs the same code
      - uses: supabase/setup-cli@v3
        with:
          version: 2.121.0
      - name: Deploy all functions (publish, cleanup-images)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ENV_FILE: ${{ matrix.env-file }}
        run: |
          url=$(grep '^VITE_SUPABASE_URL=' "$ENV_FILE" | cut -d= -f2-)
          ref=$(echo "$url" | sed -nE 's#^https://([a-z0-9]+)\.supabase\.co/?$#\1#p')
          if [ -z "$ref" ]; then echo "No project in $ENV_FILE"; exit 1; fi
          supabase functions deploy --use-api --project-ref "$ref"
