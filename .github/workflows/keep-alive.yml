# Free Supabase projects are paused after a week without activity. A light read every few days keeps them awake.
# The project URL and publishable key come from the committed .env files (both are public by design).
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 5 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query each configured project
        run: |
          for file in .env.development .env.production; do
            [ -f "$file" ] || continue
            url=$(sed -n 's/^VITE_SUPABASE_URL=//p' "$file")
            key=$(sed -n 's/^VITE_SUPABASE_KEY=//p' "$file")
            [ -n "$url" ] && [ -n "$key" ] || continue
            echo "Pinging $url"
            curl --fail --silent --show-error --max-time 30 -o /dev/null \
              -H "apikey: $key" "$url/rest/v1/puzzles?select=id&limit=1"
          done
