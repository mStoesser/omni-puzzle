<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Knobelkiste – Editor (Desktop)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F1115}
.kk{--bg:#0F1115;--surface:#171A21;--surface-2:#1F232C;--line:#2A2F3A;--text:#F3F4F6;--muted:#A1A8B5;--brand:#FFD34D;--on-brand:#1C1700;--car:#FF8A66;--car-tint:rgba(255,138,102,.14);--ok:#5BE38D;--ok-tint:rgba(91,227,141,.14);--danger:#FF7676;font-family:Inter,system-ui,sans-serif;color:var(--text);background:var(--bg)}
.kk *{box-sizing:border-box}
.kk button,.kk input,.kk textarea{font:inherit;color:inherit;cursor:pointer}
.kk h1,.kk h2,.kk h3{font-family:'Space Grotesk',Inter,sans-serif;margin:0}
.kk p{margin:0}
.board{background-color:var(--surface);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:16.666% 16.666%;background-position:-1px -1px}
a{color:var(--brand)}a:hover{color:#FFE38A}
</style>
</head>
<body>
<div class="kk" style="min-height: 100%; padding-bottom: 40px">

<header style="border-bottom: 1px solid var(--line)">
<div style="padding: 12px 24px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap">
<a href="desktop-start.html" aria-label="Editor schließen" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--text); display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
<div style="flex: 1 1 220px; min-width: 0">
<p style="font-size: 13px"><span style="color: var(--car); font-weight: 600">Ausparken</span><span style="color: var(--muted)"> · Entwurf · automatisch gespeichert</span></p>
<h1 style="font-size: 20px">Rushhour am Morgen</h1>
</div>
<div role="tablist" aria-label="Modus" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px; width: 300px">
<button role="tab" aria-selected="true" style="height: 38px; border: 0; border-radius: 10px; background: var(--surface-2); font-weight: 600; font-size: 14px">Bauen</button>
<button role="tab" aria-selected="false" style="height: 38px; border: 0; border-radius: 10px; background: transparent; font-weight: 500; font-size: 14px; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5l12 7-12 7z"></path></svg>Probespielen</button>
</div>
<div style="flex: 1 1 220px; display: flex; justify-content: flex-end; gap: 8px">
<button aria-label="Rückgängig" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"></path><path d="M4 9h11a5 5 0 0 1 0 10h-3"></path></svg></button>
<button aria-label="Wiederholen" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: #6B7280; display: grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14l5-5-5-5"></path><path d="M20 9H9a5 5 0 0 0 0 10h3"></path></svg></button>
<button style="height: 44px; padding: 0 18px; border-radius: 12px; border: 0; background: var(--brand); color: var(--on-brand); font-weight: 700; font-size: 15px">Teilen</button>
</div>
</div>
</header>

<main style="padding: 24px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">

<aside aria-label="Werkzeuge" style="flex: 1 1 200px; max-width: 260px; display: flex; flex-direction: column; gap: 10px">
<h2 style="font-size: 13px; font-family: Inter, sans-serif; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted)">Werkzeuge</h2>
<button aria-pressed="true" style="height: 52px; border-radius: 14px; border: 2px solid var(--brand); background: var(--surface-2); display: flex; align-items: center; gap: 12px; padding: 0 14px; font-size: 14px; font-weight: 600"><span style="width: 28px; height: 14px; border-radius: 4px; background: var(--car)"></span>Ziel-Auto<span style="margin-left: auto; color: var(--muted); font-size: 12px">1</span></button>
<button style="height: 52px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); display: flex; align-items: center; gap: 12px; padding: 0 14px; font-size: 14px"><span style="width: 28px; height: 14px; border-radius: 4px; background: #6B7F99"></span>Auto<span style="margin-left: auto; color: var(--muted); font-size: 12px">2</span></button>
<button style="height: 52px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); display: flex; align-items: center; gap: 12px; padding: 0 14px; font-size: 14px"><span style="width: 28px; height: 14px; border-radius: 4px; background: #94795A"></span>Laster<span style="margin-left: auto; color: var(--muted); font-size: 12px">3</span></button>
<button style="height: 52px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); display: flex; align-items: center; gap: 12px; padding: 0 14px; font-size: 14px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M3 12h18"></path><path d="M9 6l3-3 3 3M9 18l3 3 3-3"></path></svg>Drehen<span style="margin-left: auto; color: var(--muted); font-size: 12px">D</span></button>
<button style="height: 52px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); display: flex; align-items: center; gap: 12px; padding: 0 14px; font-size: 14px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20H9L4 15l10-10 7 7-6 6"></path></svg>Löschen<span style="margin-left: auto; color: var(--muted); font-size: 12px">Entf</span></button>
<p style="font-size: 13px; color: var(--muted); line-height: 1.5; margin-top: 6px">Werkzeug wählen, dann aufs Feld klicken. Ziehen verschiebt, Doppelklick dreht.</p>
</aside>

<section style="flex: 999 1 480px; min-width: 0; display: flex; justify-content: center">
<div class="board" style="width: 100%; max-width: 600px; aspect-ratio: 1 / 1; border-radius: 24px; border: 1px solid var(--line); display: grid; place-items: center">
<div style="background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; text-align: center"><p style="font-size: 15px; font-weight: 600">Bau-Fläche</p><p style="font-size: 13px; color: var(--muted); margin-top: 2px">rätselspezifisch</p></div>
</div>
</section>

<aside aria-label="Eigenschaften" style="flex: 1 1 260px; max-width: 320px; display: flex; flex-direction: column; gap: 16px">
<div style="background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<h2 style="font-size: 16px">Prüfung</h2>
<div role="status" style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 12px; background: var(--ok-tint); color: var(--ok); font-size: 14px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Lösbar</div>
<div style="display: flex; justify-content: space-between; font-size: 14px"><span style="color: var(--muted)">Kürzeste Lösung</span><span style="font-weight: 600">7 Züge</span></div>
<div style="display: flex; justify-content: space-between; font-size: 14px"><span style="color: var(--muted)">Schwierigkeit</span><span style="font-weight: 600">Mittel</span></div>
<button style="height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); font-size: 14px; font-weight: 600">Lösung abspielen</button>
</div>

<div style="background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
<h2 style="font-size: 16px">Einstellungen</h2>
<div style="display: flex; justify-content: space-between; align-items: center; font-size: 14px">
<span>Feldgröße</span>
<div style="display: flex; align-items: center; gap: 4px; background: var(--surface-2); border-radius: 10px; padding: 2px">
<button aria-label="Kleiner" style="width: 32px; height: 32px; border: 0; border-radius: 8px; background: transparent; font-size: 18px">−</button>
<span style="min-width: 44px; text-align: center; font-weight: 600">6 × 6</span>
<button aria-label="Größer" style="width: 32px; height: 32px; border: 0; border-radius: 8px; background: transparent; font-size: 18px">+</button>
</div>
</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px">Beschreibung (optional)
<textarea rows="3" placeholder="Ein kleiner Tipp für Spieler …" style="resize: vertical; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); padding: 10px; font-size: 14px; color: var(--text); cursor: text"></textarea>
</label>
</div>
</aside>

</main>
</div>
</body>
</html>
