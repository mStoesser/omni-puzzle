<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Knobelkiste – Editor</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F1115}
.kk{--bg:#0F1115;--surface:#171A21;--surface-2:#1F232C;--line:#2A2F3A;--text:#F3F4F6;--muted:#A1A8B5;--brand:#FFD34D;--on-brand:#1C1700;--car:#FF8A66;--car-tint:rgba(255,138,102,.14);--ok:#5BE38D;--ok-tint:rgba(91,227,141,.14);--danger:#FF7676;font-family:Inter,system-ui,sans-serif;color:var(--text);background:var(--bg)}
.kk *{box-sizing:border-box}
.kk button{font:inherit;color:inherit;cursor:pointer}
.kk h1,.kk h2,.kk h3{font-family:'Space Grotesk',Inter,sans-serif;margin:0}
.kk p{margin:0}
.board{background-color:var(--surface);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:58.33px 58.33px;background-position:-1px -1px}
a{color:var(--brand)}a:hover{color:#FFE38A}
</style>
</head>
<body>
<div class="kk" style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column">

<header style="display: flex; align-items: center; gap: 8px; padding: 16px 16px 8px">
<a href="mobile-start.html" aria-label="Editor schließen" style="width: 44px; height: 44px; flex: none; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--text); display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
<button style="flex: 1; min-width: 0; height: 44px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center">
<span style="font-size: 12px; font-weight: 600; color: var(--car); letter-spacing: 0.04em">AUSPARKEN · ENTWURF</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 6px">Rushhour am Morgen<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A1A8B5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"></path></svg></span>
</button>
<a href="mobile-teilen.html" style="height: 44px; padding: 0 14px; flex: none; border-radius: 12px; background: var(--brand); color: var(--on-brand); font-weight: 700; font-size: 15px; display: flex; align-items: center; text-decoration: none">Teilen</a>
</header>

<div style="padding: 8px 16px 0; display: flex; flex-direction: column; gap: 10px">
<div role="tablist" aria-label="Modus" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px">
<button role="tab" aria-selected="true" style="height: 40px; border: 0; border-radius: 10px; background: var(--surface-2); font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"></path></svg>Bauen</button>
<button role="tab" aria-selected="false" style="height: 40px; border: 0; border-radius: 10px; background: transparent; font-weight: 500; font-size: 15px; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5l12 7-12 7z"></path></svg>Probespielen</button>
</div>
<div role="status" style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 12px; background: var(--ok-tint); color: var(--ok); font-size: 14px; font-weight: 600">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
<span style="flex: 1">Lösbar · mindestens 7 Züge</span>
<span style="color: var(--muted); font-weight: 500">Mittel</span>
</div>
</div>

<main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 12px 20px">
<div class="board" style="width: 350px; height: 350px; border-radius: 20px; border: 1px solid var(--line); display: grid; place-items: center">
<div style="background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; text-align: center">
<p style="font-size: 14px; font-weight: 600">Bau-Fläche</p>
<p style="font-size: 12px; color: var(--muted); margin-top: 2px">antippen zum Platzieren</p>
</div>
</div>
</main>

<section aria-label="Werkzeuge" style="margin: 0 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted)">Werkzeuge</span>
<div style="display: flex; gap: 4px">
<button aria-label="Rückgängig" style="width: 40px; height: 40px; border: 0; border-radius: 10px; background: transparent; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"></path><path d="M4 9h11a5 5 0 0 1 0 10h-3"></path></svg></button>
<button aria-label="Wiederholen" style="width: 40px; height: 40px; border: 0; border-radius: 10px; background: transparent; color: #6B7280; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14l5-5-5-5"></path><path d="M20 9H9a5 5 0 0 0 0 10h3"></path></svg></button>
<button aria-label="Einstellungen" style="width: 40px; height: 40px; border: 0; border-radius: 10px; background: transparent; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg></button>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; padding-bottom: 28px">
<button aria-pressed="true" style="height: 64px; border-radius: 14px; border: 2px solid var(--brand); background: var(--surface-2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 600"><span style="width: 26px; height: 14px; border-radius: 4px; background: var(--car)"></span>Ziel-Auto</button>
<button style="height: 64px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500"><span style="width: 26px; height: 14px; border-radius: 4px; background: #6B7F99"></span>Auto</button>
<button style="height: 64px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500"><span style="width: 34px; height: 14px; border-radius: 4px; background: #94795A"></span>Laster</button>
<button style="height: 64px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M3 12h18"></path><path d="M9 6l3-3 3 3M9 18l3 3 3-3"></path></svg>Drehen</button>
<button style="height: 64px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20H9L4 15l10-10 7 7-6 6"></path></svg>Löschen</button>
</div>
</section>

</div>
</body>
</html>
