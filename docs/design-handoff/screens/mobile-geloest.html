<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Knobelkiste – Gelöst</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F1115}
.kk{--bg:#0F1115;--surface:#171A21;--surface-2:#1F232C;--line:#2A2F3A;--text:#F3F4F6;--muted:#A1A8B5;--brand:#FFD34D;--on-brand:#1C1700;--car:#FF8A66;--laser:#4FD8E8;--laser-tint:rgba(79,216,232,.13);--quiz:#B9A2FF;--ok:#5BE38D;--ok-tint:rgba(91,227,141,.14);--danger:#FF7676;font-family:Inter,system-ui,sans-serif;color:var(--text);background:var(--bg)}
.kk *{box-sizing:border-box}
.kk button{font:inherit;color:inherit;cursor:pointer}
.kk h1,.kk h2,.kk h3{font-family:'Space Grotesk',Inter,sans-serif;margin:0}
.kk p{margin:0}
.board{background-color:var(--surface);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:50px 50px;background-position:-1px -1px}
a{color:var(--brand)}a:hover{color:#FFE38A}
</style>
</head>
<body>
<div class="kk" style="width: 390px; height: 844px; position: relative; overflow: hidden">

<div aria-hidden="true" style="position: absolute; inset: 0; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 20px">
<div style="width: 100%; height: 44px; display: flex; justify-content: center; align-items: center"><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px">Spiegelkabinett</span></div>
<div class="board" style="width: 350px; height: 350px; border-radius: 20px; margin-top: 60px"></div>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(8,9,12,.72)"></div>

<section role="dialog" aria-modal="true" aria-labelledby="solved-title" style="position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); border-top-left-radius: 28px; border-top-right-radius: 28px; border-top: 1px solid var(--line); padding: 12px 20px 32px; display: flex; flex-direction: column; align-items: center; gap: 18px">
<div style="width: 40px; height: 5px; border-radius: 99px; background: var(--line)"></div>

<div style="width: 72px; height: 72px; border-radius: 24px; background: var(--ok-tint); color: var(--ok); display: grid; place-items: center; margin-top: 4px"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></div>

<div style="text-align: center">
<h1 id="solved-title" style="font-size: 30px; letter-spacing: -0.02em">Gelöst!</h1>
<p style="color: var(--muted); font-size: 15px; margin-top: 6px">Optimal – so wenige Züge geht’s nicht.</p>
</div>

<div style="width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<div style="background: var(--surface-2); border-radius: 14px; padding: 12px; text-align: center"><p style="font-size: 12px; color: var(--muted)">Deine Züge</p><p style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; color: var(--ok)">4</p></div>
<div style="background: var(--surface-2); border-radius: 14px; padding: 12px; text-align: center"><p style="font-size: 12px; color: var(--muted)">Minimum</p><p style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700">4</p></div>
<div style="background: var(--surface-2); border-radius: 14px; padding: 12px; text-align: center"><p style="font-size: 12px; color: var(--muted)">Zeit</p><p style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700">1:12</p></div>
</div>

<div style="width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px">
<div><p style="font-size: 14px; font-weight: 600">Hat’s dir gefallen?</p><p style="font-size: 13px; color: var(--muted); margin-top: 2px">von Michi</p></div>
<button aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>Gefällt mir</button>
</div>

<div style="width: 100%; display: flex; flex-direction: column; gap: 10px">
<a href="mobile-spiel.html" style="height: 52px; border-radius: 14px; background: var(--brand); color: var(--on-brand); font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none">Nächstes Rätsel: Lichtlabyrinth<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button style="height: 48px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="18" cy="5" r="2.5"></circle><circle cx="6" cy="12" r="2.5"></circle><circle cx="18" cy="19" r="2.5"></circle><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"></path></svg>Teilen</button>
<button style="height: 48px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"></path></svg>Remixen</button>
</div>
</div>
</section>

</div>
</body>
</html>
