<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Knobelkiste – Teilen</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F1115}
.kk{--bg:#0F1115;--surface:#171A21;--surface-2:#1F232C;--line:#2A2F3A;--text:#F3F4F6;--muted:#A1A8B5;--brand:#FFD34D;--brand-tint:rgba(255,211,77,.12);--on-brand:#1C1700;--car:#FF8A66;--ok:#5BE38D;--danger:#FF7676;font-family:Inter,system-ui,sans-serif;color:var(--text);background:var(--bg)}
.kk *{box-sizing:border-box}
.kk button,.kk input{font:inherit;color:inherit;cursor:pointer}
.kk h1,.kk h2,.kk h3{font-family:'Space Grotesk',Inter,sans-serif;margin:0}
.kk p{margin:0}
.board{background-color:var(--surface);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:58px 58px}
a{color:var(--brand)}a:hover{color:#FFE38A}
</style>
</head>
<body>
<div class="kk" style="width: 390px; height: 844px; position: relative; overflow: hidden">

<div aria-hidden="true" style="position: absolute; inset: 0; padding: 16px; display: flex; flex-direction: column; align-items: center">
<div style="height: 44px; display: flex; align-items: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700">Rushhour am Morgen</div>
<div class="board" style="width: 350px; height: 350px; border-radius: 20px; margin-top: 120px"></div>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(8,9,12,.72)"></div>

<section role="dialog" aria-modal="true" aria-labelledby="share-title" style="position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); border-top-left-radius: 28px; border-top-right-radius: 28px; border-top: 1px solid var(--line); padding: 12px 20px 32px; display: flex; flex-direction: column; gap: 16px">
<div style="align-self: center; width: 40px; height: 5px; border-radius: 99px; background: var(--line)"></div>
<div style="display: flex; justify-content: space-between; align-items: center">
<h1 id="share-title" style="font-size: 22px">Rätsel teilen</h1>
<button aria-label="Schließen" style="width: 40px; height: 40px; border-radius: 999px; border: 0; background: var(--surface-2); display: grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>

<div style="border: 2px solid var(--brand); background: var(--brand-tint); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; gap: 12px; align-items: flex-start">
<div style="width: 40px; height: 40px; flex: none; border-radius: 12px; background: var(--brand); color: var(--on-brand); display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"></path><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg></div>
<div><h2 style="font-size: 16px">Per Link an Freunde</h2><p style="font-size: 13px; color: var(--muted); margin-top: 2px">Kein Konto nötig. Wer den Link hat, kann spielen.</p></div>
</div>
<div style="display: flex; gap: 8px">
<label style="flex: 1; min-width: 0; height: 44px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); display: flex; align-items: center; padding: 0 12px">
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden">Link</span>
<input readonly value="knobelkiste.app/r/7Fq2-Xa9" style="width: 100%; background: transparent; border: 0; outline: none; font-size: 14px; color: var(--text)">
</label>
<button style="height: 44px; padding: 0 14px; border-radius: 12px; border: 0; background: var(--brand); color: var(--on-brand); font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5a1 1 0 0 1 1-1h10"></path></svg>Kopieren</button>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button style="height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="18" cy="5" r="2.5"></circle><circle cx="6" cy="12" r="2.5"></circle><circle cx="18" cy="19" r="2.5"></circle><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"></path></svg>Senden an …</button>
<button style="height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6" height="6"></rect><rect x="14" y="4" width="6" height="6"></rect><rect x="4" y="14" width="6" height="6"></rect><path d="M14 14h2v2M20 14v6h-6"></path></svg>QR-Code</button>
</div>
</div>

<div style="border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; gap: 12px; align-items: flex-start">
<div style="width: 40px; height: 40px; flex: none; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.5 3 2.5 15 0 18M12 3c-2.5 3-2.5 15 0 18"></path></svg></div>
<div style="flex: 1"><h2 style="font-size: 16px">In der Galerie veröffentlichen</h2><p style="font-size: 13px; color: var(--muted); margin-top: 2px">Für alle sichtbar, mit Likes und Bewertungen.</p></div>
</div>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 14px">
<li style="display: flex; align-items: center; gap: 8px; color: var(--ok)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg><span style="color: var(--text)">Lösbar (mind. 7 Züge)</span></li>
<li style="display: flex; align-items: center; gap: 8px; color: var(--ok)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg><span style="color: var(--text)">Selbst probegespielt</span></li>
<li style="display: flex; align-items: center; gap: 8px; color: var(--muted)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle></svg>Angemeldet als Hans</li>
</ul>
<button style="height: 48px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 700; font-size: 15px">Veröffentlichen …</button>
</div>
</section>

</div>
</body>
</html>
