# Supabase CLI configuration. Only used to deploy Edge Functions (.github/workflows/deploy-functions.yml);
# the database is migrated by hand (see README).
project_id = "omni-puzzle"

[functions.publish]
# The function checks the user's token itself (src/server/publish-handler.ts).
verify_jwt = false

[functions.cleanup-images]
# Protected by the shared secret CLEANUP_SECRET instead of a user token.
verify_jwt = false

[functions.submit-score]
# The function checks the user's token itself (src/server/score-handler.ts).
verify_jwt = false
